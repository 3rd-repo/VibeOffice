# The macOS desktop app (desktop/, docs/desktop.md, macOS), built on a Mac by desktop/macos/build.sh: VibeOffice-macOS.dmg,
# signed with Developer ID, notarized and published in the version's GitHub release (the same tag as Windows', e.g.
# v2026.10.11-d2134d); with app_store ticked, also VibeOffice-macOS-AppStore.pkg uploaded to App Store Connect
# (TestFlight, then review). Every run also opens the app with a few files and keeps screenshots (artifact
# VibeOffice-macOS-smoke).
# The signing material lives in the "release" environment's secrets (docs/desktop.md lists them). Without them the
# app is signed ad hoc and the run makes no release: an artifact with the app and the screenshots only.
# Run by hand only: Actions ▸ macOS ▸ Run workflow. Running it again on the same commit replaces the release's DMG.
name: macOS

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false
      app_store:
        description: Also upload the App Store package to App Store Connect
        type: boolean
        default: false

permissions:
  contents: write   # create the release and its tag

jobs:
  build:
    runs-on: macos-15
    environment: release
    env:
      HAVE_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID_P12 != '' }}
      HAVE_APP_STORE: ${{ secrets.MACOS_APPSTORE_P12 != '' && secrets.MACOS_PROVISION_PROFILE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-macos-${{ hashFiles('desktop/Cargo.lock') }}

      # A keychain of this run's own, with the certificates; the API key where notarytool and altool look for it
      - name: Signing material
        if: env.HAVE_DEVELOPER_ID == 'true' || env.HAVE_APP_STORE == 'true'
        env:
          DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
          APPSTORE_P12: ${{ secrets.MACOS_APPSTORE_P12 }}
          APPSTORE_PASSWORD: ${{ secrets.MACOS_APPSTORE_PASSWORD }}
          PROVISION_PROFILE: ${{ secrets.MACOS_PROVISION_PROFILE }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass=$(openssl rand -hex 24)
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          import() {   # base64 .p12, its password
            [ -n "$1" ] || return 0
            echo "$1" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$2" -T /usr/bin/codesign -T /usr/bin/productbuild
            rm "$RUNNER_TEMP/cert.p12"
          }
          import "$DEVELOPER_ID_P12" "$DEVELOPER_ID_PASSWORD"
          import "$APPSTORE_P12" "$APPSTORE_PASSWORD"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v
          if [ -n "$PROVISION_PROFILE" ]; then
            echo "$PROVISION_PROFILE" | base64 --decode > "$RUNNER_TEMP/appstore.provisionprofile"
            echo "MACOS_PROVISION_PROFILE=$RUNNER_TEMP/appstore.provisionprofile" >> "$GITHUB_ENV"
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Build
        id: build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          desktop/macos/build.sh
          echo "version=$(tools/current-tree-version.sh)" >> "$GITHUB_OUTPUT"

      # The app as a user starts it: alone, then with a document, a workbook as CSV and Markdown handed over as Finder
      # does (open -a), each a window of its own; a screenshot after each
      - name: Smoke
        run: |
          app="$PWD/desktop/target/dist/VibeOffice.app"
          out="$RUNNER_TEMP/smoke"
          mkdir -p "$out/files"
          cp tests/quire/lines/linecases.docx "$out/files/"
          printf 'Item,Cost\nRent,900\nFood,250\n' > "$out/files/Budget.csv"
          printf '# Notes\n\nHello from the smoke run.\n' > "$out/files/Notes.md"
          open -a "$app"
          sleep 20
          screencapture -x "$out/1-start-center.png"
          n=2
          for f in linecases.docx Budget.csv Notes.md; do
            open -a "$app" "$out/files/$f"
            sleep 12
            screencapture -x "$out/$n-$f.png"
            n=$((n + 1))
          done
          osascript -e 'quit app "VibeOffice"' || pkill -x vibeoffice || true
          log show --last 5m --predicate 'process == "vibeoffice"' --style compact > "$out/app.log" 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VibeOffice-macOS-smoke
          path: ${{ runner.temp }}/smoke/*.*
          if-no-files-found: warn

      # Without a Developer ID the app is only signed ad hoc: kept as an artifact to try (remove the quarantine first:
      # xattr -dr com.apple.quarantine VibeOffice.app), never released
      - name: Unsigned app
        if: env.HAVE_DEVELOPER_ID != 'true'
        run: ditto -c -k --keepParent desktop/target/dist/VibeOffice.app "$RUNNER_TEMP/VibeOffice-macOS-unsigned.zip"
      - uses: actions/upload-artifact@v4
        if: env.HAVE_DEVELOPER_ID != 'true'
        with:
          name: VibeOffice-macOS-unsigned
          path: ${{ runner.temp }}/VibeOffice-macOS-unsigned.zip

      - uses: actions/upload-artifact@v4
        if: env.HAVE_DEVELOPER_ID == 'true'
        with:
          name: VibeOffice-macOS
          path: desktop/target/dist/VibeOffice-macOS.dmg
          if-no-files-found: error

      - name: Release
        if: env.HAVE_DEVELOPER_ID == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          files="desktop/target/dist/VibeOffice-macOS.dmg"
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" $files --clobber
          else
            flag=""
            [ "$PRERELEASE" = "true" ] && flag="--prerelease"
            gh release create "$VERSION" $files --target "$GITHUB_SHA" --title "VibeOffice $VERSION" $flag \
              --notes-file desktop/release-notes.md
          fi

      - name: App Store Connect
        if: inputs.app_store && env.HAVE_APP_STORE == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app --type macos --file desktop/target/dist/VibeOffice-macOS-AppStore.pkg \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove the keychain
        if: always() && (env.HAVE_DEVELOPER_ID == 'true' || env.HAVE_APP_STORE == 'true')
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf ~/.appstoreconnect
