# The Windows desktop app (desktop/, docs/desktop.md): the MSI and the Portable zip, built on Linux with mingw and
# wixl, published as a GitHub release tagged with the version (tools/current-tree-version.sh, e.g. v2026.10.11-d2134d).
# Run by hand only: Actions ▸ Windows ▸ Run workflow (pick the branch). Running it again on the same commit
# replaces the release's files.
name: Windows

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

permissions:
  contents: write   # create the release and its tag

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 wixl zip
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-gnu
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-${{ hashFiles('desktop/Cargo.lock') }}

      - name: Build
        id: build
        run: |
          desktop/build.sh
          echo "version=$(tools/current-tree-version.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: VibeOffice-${{ steps.build.outputs.version }}-windows-x64
          path: |
            desktop/target/dist/*.msi
            desktop/target/dist/*.zip
          if-no-files-found: error

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          files="desktop/target/dist/VibeOffice-$VERSION-x64.msi desktop/target/dist/VibeOffice-$VERSION-x64-Portable.zip"
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" $files --clobber
            gh release delete-asset "$VERSION" "VibeOffice-$VERSION-x64.zip" -y 2> /dev/null || true   # the zip's name before Portable
          else
            flag=""
            [ "$PRERELEASE" = "true" ] && flag="--prerelease"
            gh release create "$VERSION" $files --target "$GITHUB_SHA" --title "VibeOffice $VERSION" $flag \
              --notes "Windows x64: VibeOffice-$VERSION-x64.msi installs for all users (Start menu, Open with for .docx, .xlsx and .pptx). VibeOffice-$VERSION-x64-Portable.zip runs without installing: extract it and start vibeoffice.exe inside its VibeOffice folder (WebView2Loader.dll stays beside it). Both need the Microsoft Edge WebView2 runtime, which Windows 10 and 11 include."
          fi
