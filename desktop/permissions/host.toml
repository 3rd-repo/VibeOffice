# The host_* commands (src/host.rs, src/doc.rs) each kind of window may call, granted in capabilities/. With these
# defined, Tauri refuses any of our commands a window's capability doesn't grant, and every Tauri core command, which
# no capability grants (docs/desktop.md, Host interface).

[[permission]]
identifier = "start-center"
description = "The Start Center: Open File, Recent Files, a dropped file, app windows, the UI size, the update page"
commands.allow = [
  "host_open",
  "host_open_recent",
  "host_new_document",
  "host_recent",
  "host_recent_preview",
  "host_recent_remove",
  "host_recent_clear",
  "host_new_window",
  "host_open_url",
  "host_ui_scale",
  "host_set_ui_scale",
]

[[permission]]
identifier = "app-window"
description = "Quire, Ledger and Lectern: the window's document, its draft and preview, saving it (Save, Save As, exports, previous versions), File > Open, Recent Files, Document Recovery, the Window menu, closing, the licences page (About)"
commands.allow = [
  "host_document",
  "host_document_bytes",
  "host_open",
  "host_open_recent",
  "host_new_document",
  "host_recent",
  "host_recent_preview",
  "host_set_preview",
  "host_set_draft",
  "host_clear_draft",
  "host_discard_draft",
  "host_windows",
  "host_focus",
  "host_closing",
  "host_save",
  "host_choose",
  "host_write_chosen",
  "host_cancel_choice",
  "host_versions",
  "host_open_version",
  "host_new_window",
  "host_close_window",
]
