[package]
name = "vibeoffice-setup"
version = "0.1.0"
description = "VibeOffice for Windows: the installer (VibeOfficeSetup.exe), carrying the app built in ../"
edition = "2021"
publish = false

# What it calls on Windows (Known DLLs only: build.sh checks the exe's imports)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "UI_Shell",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
